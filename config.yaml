# Training config. Edit and re-run; or override version per-run with:
#   VERSION=4 accelerate launch train.py
# Output goes to runs/v{version}/ (wiped if it already exists).

version: 1
seed: 42

# Length
epochs: 20
warmup_steps: 2000          # in total (cross-rank) optimizer steps

# Optimizer
base_lr: 5e-4               # AdamW peak LR for the projector / head params
backbone_lr_mult: 0.2       # backbone LR = base_lr * backbone_lr_mult.
                            # 0.2 -> 1e-4 for ImageNet-pretrained image bb + retrieval-trained
                            # text bb (gentler updates preserve pretrained features).
                            # Set to 1.0 for single-LR behaviour (no two-group split).
weight_decay: 0.1
grad_clip: 1.0

# Cadence
n_negs: 1024

log_every: 50               # in-batch metrics every N steps
eval_every_frac: 1          # N evals per epoch. 1 = once per epoch (~15-20 min per eval on 1M val).
