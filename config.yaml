# Training config. Edit and re-run; or override version per-run with:
#   VERSION=4 accelerate launch train.py
# Output goes to runs/v{version}/ (wiped if it already exists).

version: 1
seed: 42

# Length
epochs: 20
warmup_steps: 1000          # in total (cross-rank) optimizer steps.
                            # Halved from 2000 when per-rank batch went 256 -> 512
                            # (steps/epoch halved; keeps warmup at the same ~0.3 epoch).

# Optimizer
base_lr: 1e-3               # AdamW peak LR for all params (head and backbone)
backbone_lr_mult: 1.0       # backbone LR = base_lr * backbone_lr_mult.
                            # 1.0 = single-LR, no head/backbone split. Raised from
                            # 5e-4 / 0.2 after the global batch doubled to 3072.
weight_decay: 0.1
grad_clip: 1.0

# Cadence
log_every: 50               # in-batch metrics every N steps
eval_every_frac: 1          # N evals per epoch. 1 = once per epoch (~15-20 min per eval on 1M val).
profile: true               # print [prof] phase timings + [data-wait/rank] every log window.
                            # Costs a few GPU syncs per step; turn off once you trust the pipeline.
